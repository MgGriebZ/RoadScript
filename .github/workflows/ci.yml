name: Build and test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Same publish step the Azure Static Web Apps build runs
      - name: Publish app
        run: dotnet publish RoadScript.csproj -c Release -o publish

      - name: Run tests
        run: dotnet test tests/RoadScript.Tests/RoadScript.Tests.csproj -c Release
