<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <!-- Mobile-optimized viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e2f" />

    <!-- Touch Icons -->
    <meta name="apple-mobile-web-app-title" content="RoadScript" />

    <title>RoadScript</title>
    <base href="/" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mobile.css" />

    <!-- BlazorMonaco bundled CSS -->
    <link rel="stylesheet" data-name="vs/editor/editor.main"
          href="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.css" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- BlazorMonaco bundled scripts (BEFORE Blazor framework) -->
    <script src="_content/BlazorMonaco/jsInterop.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
    <script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>

    <!-- RoadScript custom interop -->
    <script src="js/roadscript-interop.js"></script>
    <script src="js/responsive-interop.js"></script>
    <script src="js/touch-gestures.js"></script>

    <!-- Blazor framework -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
